{% extends "base.html" %}
{% block title %}Anmelden | Fundplatz{% endblock %}
{% block content %}
<section class="container py-5">
    <div class="auth-panel mx-auto">
        <h1 class="h2 fw-bold mb-2">Anmelden</h1>
        <p class="text-secondary">Verwende zunächst deinen Django-Superuser von Tag 1.</p>
        {% if form.errors %}
            <div class="alert alert-danger" role="alert">Benutzername oder Passwort ist falsch.</div>
        {% endif %}
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label" for="id_username">Benutzername</label>
                <input type="text" id="id_username" name="username" class="form-control"
                       autocomplete="username" autofocus required value="{{ form.username.value|default_if_none:'' }}">
            </div>
            <div class="mb-4">
                <label class="form-label" for="id_password">Passwort</label>
                <input type="password" id="id_password" name="password" class="form-control"
                       autocomplete="current-password" required>
            </div>
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            <button class="btn btn-primary w-100 rounded-pill" type="submit">Anmelden</button>
        </form>
    </div>
</section>
{% endblock %}
